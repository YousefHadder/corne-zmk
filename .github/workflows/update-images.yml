name: Update Nice!View Images

on:
  push:
    paths:
      - 'assets/**'
      - 'scripts/niceview_lvgl_convert.py'
      - 'scripts/requirements-images.txt'
      - 'tests/test_niceview_lvgl_convert.py'
      - '.github/workflows/update-images.yml'
  pull_request:
    paths:
      - 'assets/**'
      - 'scripts/niceview_lvgl_convert.py'
      - 'scripts/requirements-images.txt'
      - 'tests/test_niceview_lvgl_convert.py'
      - 'boards/shields/nice_view_custom/widgets/**'
      - '.github/workflows/update-images.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-images:
    name: Validate image generation
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Python dependencies
      run: python -m pip install -r scripts/requirements-images.txt

    - name: Test image generation
      run: python -m unittest discover -s tests -v

    - name: Validate repository artwork
      run: python scripts/niceview_lvgl_convert.py --assets-dir assets --outdir converted --update-firmware

    - name: Check pull request includes generated artwork
      if: github.event_name == 'pull_request'
      run: git diff --exit-code -- boards/shields/nice_view_custom/widgets/art.c boards/shields/nice_view_custom/widgets/peripheral_status.c

  update-images:
    needs: validate-images
    if: github.event_name != 'pull_request' && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.ACTIONS_PAT }}

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Python dependencies
      run: python -m pip install -r scripts/requirements-images.txt

    - name: Generate firmware artwork
      run: python scripts/niceview_lvgl_convert.py --assets-dir assets --outdir converted --update-firmware

    - name: Commit and push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

        git add boards/shields/nice_view_custom/widgets/art.c
        git add boards/shields/nice_view_custom/widgets/peripheral_status.c

        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
            git commit -m "🤖 Auto-update Nice!View images and peripheral_status declarations."
            git push
        fi
